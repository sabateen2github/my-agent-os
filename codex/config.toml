# Agent OS — Codex Configuration (DeepSeek V4-Flash)
# This is a TEMPLATE. Run codex/setup.sh to install with your keys.

model = "deepseek-v4-flash"
model_provider = "deepseek"
preferred_auth_method = "apikey"
forced_login_method = "api"
model_reasoning_effort = "high"
model_catalog_json = "~/.codex/models.json"

[model_providers.deepseek]
name = "deepseek"
base_url = "https://api.deepseek.com/"
wire_api = "responses"
experimental_bearer_token = "{DEEPSEEK_API_KEY}"

[mcp_servers.brave-search]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-brave-search"]

[mcp_servers.brave-search.env]
BRAVE_API_KEY = "{BRAVE_API_KEY}"

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp", "--cdp-endpoint", "http://localhost:9222", "--browser", "chrome", "--caps", "vision"]

model_instructions_file = "~/.codex/agent-os-instructions.md"
